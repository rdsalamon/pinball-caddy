<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pinball Caddy</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --border:#334155; --text:#f8fafc; --muted:#94a3b8; --accent:#38bdf8; --gold:#fbbf24; --ok:#34d399; --bad:#f87171; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); padding:14px 14px 85px; }
  header { display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--border); padding-bottom:10px; margin-bottom:12px; }
  h1 { margin:0; font-size:19px; color:var(--gold); }
  .btn { background:#0284c7; color:#fff; border:none; padding:9px 12px; border-radius:10px; font-weight:600; cursor:pointer; font-size:13px; }
  .btn-gold { background:#d97706; } .btn-sec { background:var(--card); border:1px solid var(--border); color:var(--text); }
  .btn-ok { background:#065f46; color:var(--ok); border:1px solid var(--ok); } .btn-bad { background:#7f1d1d; color:var(--bad); border:1px solid var(--bad); }
  .inp, textarea { width:100%; padding:10px; border-radius:10px; border:1px solid var(--border); background:#0b1120; color:var(--text); font-size:15px; margin-bottom:10px; }
  textarea { min-height:68px; font-family:inherit; }
  .box, .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 14px; margin-bottom:8px; }
  .card { display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
  .row { display:flex; gap:8px; margin-top:8px; } .row .btn { flex:1; }
  .fl { font-size:11px; font-weight:700; color:var(--accent); text-transform:uppercase; margin-bottom:4px; }
  .fg { margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid var(--border); }
  .pills { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:12px; }
  .pill { background:var(--card); border:1px solid var(--border); color:var(--accent); padding:5px 9px; border-radius:8px; font-size:12px; font-weight:700; cursor:pointer; }
  .pill.active { background:var(--accent); color:#0f172a; }
  .grp-hdr { font-size:13px; font-weight:800; color:var(--gold); text-transform:uppercase; margin:14px 0 6px; letter-spacing:0.5px; }
  .bar { position:fixed; bottom:0; left:0; right:0; background:var(--bg); border-top:1px solid var(--border); padding:10px 14px; display:flex; gap:8px; }
  .bar .btn { flex:1; } .hidden { display:none; }
</style>
</head>
<body>
<header>
  <div><h1>PINBALL CADDY <span id="verBadge" style="font-size:12px;font-weight:500;color:var(--muted);"></span></h1><div id="sub" style="font-size:12px;color:var(--muted);">Loading Library...</div></div>
  <button class="btn btn-gold" onclick="show('vAddMenu')">+ Add Machine</button>
</header>

<div id="vList">
  <div class="row" style="margin:0 0 10px;">
    <button class="btn" id="tabAZ" onclick="setMode('az')">A–Z Alphabetical</button>
    <button class="btn btn-sec" id="tabMfg" onclick="setMode('mfg')">By Manufacturer</button>
  </div>
  <div style="display:flex;gap:6px;margin-bottom:10px;">
    <input type="text" id="qIn" class="inp" style="margin:0;flex:1;" placeholder="Search any machine..." oninput="renderList()">
    <button class="btn btn-sec" onclick="document.getElementById('qIn').value='';renderList();" title="Clear search">✕</button>
  </div>
  <div id="azBar" class="pills"></div>
  <div id="list"></div>
</div>

<div id="vAddMenu" class="hidden">
  <div class="box">
    <h3 style="margin-top:0;color:var(--gold);">Add a New Machine</h3>
    <p style="font-size:13px;color:var(--muted);">Choose how you want to add a rulesheet to your Caddy:</p>
    <button class="btn btn-gold" style="width:100%;margin-bottom:10px;padding:14px;" onclick="show('vImp')">From a Rulesheet PDF (Uses Gemini)</button>
    <button class="btn" style="width:100%;margin-bottom:10px;padding:14px;" onclick="openForm()">Manual Entry (Type / Paste Fields)</button>
    <button class="btn btn-sec" style="width:100%;" onclick="show('vList')">← Back to Library</button>
  </div>
</div>

<div id="vDet" class="hidden">
  <div class="box" id="detBox"></div>
  <div class="row">
    <button class="btn btn-sec" onclick="show('vList')">← Back</button>
    <button class="btn" id="editBtn">Edit / Notes</button>
    <button class="btn btn-bad" id="delBtn">Delete</button>
  </div>
</div>

<div id="vForm" class="hidden">
  <div class="box">
    <h3 id="fTitle" style="margin-top:0;color:var(--gold);">Machine Details</h3>
    <input type="text" id="f_name" class="inp" placeholder="Machine Name (e.g. Jaws (Stern))">
    <input type="text" id="f_code" class="inp" placeholder="1. Latest Known Code & Clue">
    <textarea id="f_skill" placeholder="2. Skill Shot (+ Physical Location)"></textarea>
    <textarea id="f_modes" placeholder="3. How to Start Modes (+ Physical Location)"></textarea>
    <textarea id="f_multi" placeholder="4. Primary Multiball (+ Physical Location)"></textarea>
    <textarea id="f_mult" placeholder="5. Playfield Multipliers (+ Physical Location)"></textarea>
    <textarea id="f_strat" placeholder="6. Best Point Strategy"></textarea>
    <textarea id="f_watch" placeholder="7. Watch Out / Drain Hazards"></textarea>
    <textarea id="f_misc" placeholder="8. Misc / Personal Tournament Notes"></textarea>
    <div class="row"><button class="btn btn-sec" onclick="show('vList')">Cancel</button><button class="btn" onclick="saveForm()">Save</button></div>
  </div>
</div>

<div id="vImp" class="hidden">
  <div class="box">
    <h3 style="margin-top:0;color:var(--gold);">Step 1: Copy Prompt & Open Gemini</h3>
    <textarea id="pdfPromptBox" style="min-height:85px;font-size:12px;" readonly>Read the attached pinball rulesheet PDF and summarize it using these exact 9 labels on separate lines:
NAME: [Official Machine Name + Manufacturer]
CODE: [Latest code version + 1-line visual clue]
SKILL: [Skill Shot + physical location in parentheses]
MODES: [Theme name for modes + exact shots and physical locations to start them]
MULTI: [Primary multiball + shots and physical locations to start]
MULT: [Playfield multipliers + shots and physical locations]
STRAT: [Best tournament point strategy & stacking]
WATCH: [Drain hazards or ball-save quirks]
MISC: [Extra tournament tips, wizard modes, or custom notes]</textarea>
    <div class="row" style="margin-bottom:14px;">
      <button class="btn btn-ok" onclick="copyPdfPrompt()">1. Copy Prompt</button>
      <a href="https://google.com" target="_blank" class="btn" style="text-align:center;text-decoration:none;">2. Open Gemini ↗</a>
    </div>
    <h3 style="margin-top:0;color:var(--gold);">Step 2: Paste Gemini's Reply Here</h3>
    <textarea id="jsonPasteBox" style="min-height:95px;font-size:12px;" placeholder="Paste the NAME: / CODE: / SKILL: reply here..."></textarea>
    <div class="row"><button class="btn btn-sec" onclick="show('vList')">Cancel</button><button class="btn" onclick="importJsonCard()">Auto-Create Card</button></div>
  </div>
</div>

<div id="vExp" class="hidden">
  <div class="box">
    <h3 style="margin-top:0;color:var(--gold);">PC AI Training Export (.JSONL)</h3>
    <div class="row" style="margin-bottom:10px;"><button class="btn btn-ok" onclick="copyExp()">Copy</button><button class="btn" onclick="dlExp()">Download .jsonl</button></div>
    <textarea id="expBox" style="min-height:160px;font-family:monospace;font-size:12px;" readonly></textarea>
    <div class="row"><button class="btn btn-sec" onclick="show('vList')">← Back</button></div>
  </div>
</div>

<div class="bar">
  <button class="btn btn-sec" onclick="show('vList')">Library</button>
  <button class="btn btn-sec" onclick="show('vAddMenu')">+ Add</button>
  <button class="btn btn-ok" onclick="openExp()">Export AI</button>
</div>

<script>
const APP_VER = "v1.0";
const DB = "pinball_caddy_" + APP_VER;
document.getElementById("verBadge").textContent = APP_VER;
const STARTERS = [
  {
    "name": "Fallout (Stern)",
    "code": "v0.82 (Displayed on lower Pip-Boy LCD / backboard screen)",
    "skill": "Time the full plunge to roll over the flashing Nuka-Cola insert on the right inlane, lowering the Nuka-Cola spinner (mid-right). Immediately rip the spinner with the right flipper for 3M base + 75k per spin and ball save.",
    "modes": "Qualify Quests at scoop (mid-right) by boosting HP above 50 via left orbit (upper-left) or right ramp (mid-right). Wedding Day: 2-ball multiball making alternating blue/yellow shots across ramps/orbits, bash Deathclaw (center) 5x for add-a-ball, collect super jackpot at vault door (center). Radscorpion Attack: Lit shots build value, shoot center jump ramp (center) 4x, then finish at right standup targets (mid-right) or Fat Man launcher. The Kings: 2-ball multiball comboing lit shots up to 8x to light super jackpot at right standup target (mid-right). Mind Control: Lit ramps lower spinner (mid-right); rip spinner to advance levels. NOVAC: Shoot left orbit (upper-left) and right ramp (mid-right) 6x, then finish at pipboy ramps (mid-left / upper-left). Find the Target: Hit 3 yellow shots, scoop (mid-right), right ramp (mid-right), load Fat Man via pipboy ramps (mid-left / upper-left), then strike target at right standups (mid-right). Vault Modes / Lunchbox: Spell VAULT, shoot center ramp / vault door (center) to play mini-games or Find the Lunchbox.",
    "multi": "Deathclaw Multiball: Shoot Deathclaw bash toy (center) when FIRE is lit to cripple 4 limbs; hit 4 radroach targets (standups) for add-a-ball. Wasteland Multiball: Complete 3-bank standups (mid-right), load launcher via pipboy ramps (mid-left / upper-left), clear enemies on left orbit (upper-left), U-turn (center-left), and right ramp (mid-right); super jackpot at upper pipboy ramp or center-right standup. Vault Multiball: Awarded on odd lunchboxes (3-ball); roving jackpot moves lower pipboy (mid-left) -> upper pipboy (upper-left) -> U-turn (center-left) -> center jump ramp (center) -> right ramp (mid-right), then upper loop (upper-left) for double, super jackpot at center jump ramp (center).",
    "mult": "Power Armor 2x Playfield: Left pop bumper (upper-left) charges fusion core; once past 50%, hold action button to engage 2x playfield scoring for the duration of the core drain. Radio Jackpot multiplier stacks +1x per focus shot made. The Kings quest provides up to 8x shot multipliers via combos.",
    "strat": "Pick The Ghoul for beginner survivability (radroaches restore HP instead of inflicting RAD) or Maximus for extended 2x Power Armor. Keep HP above 50 by hitting the left orbit (upper-left) to keep quests available at the scoop (mid-right). Stack Power Armor 2x playfield into Wasteland Multiball or Deathclaw Multiball for massive scoring. Use companions actively: Dogmeat spots radroaches, while Mr. Handy spots Deathclaw limbs.",
    "watch": "Deathclaw kickback: On Premium/LE, hitting a crippled limb causes the Deathclaw (center) to rocket the ball directly back toward the drain. Striking already-dead radroaches inflicts RAD, truncating your HP and quest timers. Radio mode timers keep running while cradling the ball.",
    "_src": "https://pinballrulesheets.com/stern/fallout-rulesheet"
  },
  {
    "name": "Pokemon (Stern)",
    "code": "v0.87 - Meowth balloon lowers at center; LCD shows Kanto starters and biome travel",
    "skill": "Plunge into flashing top lane for +2x Bonus X (+1x each subsequent, starts 500k). Super Skill Shot (hold left flipper & full plunge): center lane (center) completes BATTLE targets and lowers Meowth balloon (instantly starts Team Rocket Multiball + lights add-a-ball if qualified); town scoop (mid-right) lights Mystery. Secret Skill Shot: bounce into Psyduck sneak-in (mid-left) for 3x value (1.5M).",
    "modes": "Story Modes: Shoot shots 3x (Level 1) or +5x (Level 2) to start Bulbasaur (left orbit), Squirtle (left ramp), Pikachu (right ramp), Charmander (right orbit). Completing training targets (mid-left) extends timer +20s. CATCH! Hurry-Up: Charge gauge via top lanes/bumpers, shoot captive ball (mid-left) to scan, hit lit purple targets to spell CATCH!, then shoot left ramp (mid-left) to catch (boosts next Story Mode up to 3x). Rival Battles: Lit at town scoop (mid-right) after catching Pok\u00e9mon; deal damage via lit shots, switch Pok\u00e9mon at town scoop (mid-right), win for Victory Bonus at left ramp (mid-left). Arena Battle: 6-boss gauntlet at town scoop (mid-right) after traveling to all 4 biomes.",
    "multi": "Team Rocket Multiball 1 & 2: Spell BATTLE targets or super skill to lower Meowth balloon, hit balloon 4x/5x, then enter center lane (center) to start; add-a-ball by completing BATTLE targets and hitting Action Button. Pikachu vs. Raichu (2-ball) & Pikachu vs. Mimikyu (3-ball): Started from Pikachu (right ramp). Mini-Wizards: Pikachu vs. Lucario (up to 6-ball MB) & Pikachu vs. Charizard (4-ball MB) lit at right ramp (mid-right) after playing all four Level 1 or 2 Story Modes.",
    "mult": "2x Playfield: Hit left and right Berry targets (beside left ramp / captive ball) twice each, then hit center Berry target to start 20s 2x playfield (refresh +5s via center Berry target, max 20s). Shot Multipliers: 2x (up to 3x) awarded to next shot made after completing any Story Mode or scoring 1st Super Jackpot in Team Rocket Multiball. Story Multiplier: +1x per caught Pok\u00e9mon (up to 3x). Team Rocket Multiplier: +1x per Rival Battle won (up to 3x). Bonus X: Advanced via top lanes (max 20x).",
    "strat": "Catch wild Pok\u00e9mon early to build the 3x Story Mode multiplier before starting Level 2 modes or Pikachu multiballs. Win Rival Battles quickly to stack the permanent 3x Team Rocket Multiball multiplier. Stack 2x Playfield (Berries) with Team Rocket Multiball or Pikachu vs. Charizard for massive Super Jackpots. Work town targets to keep the alternating outlane ball save active at all times.",
    "watch": "Arena Battle features disruptive boss phases: Gengar kills all playfield GI lights, and Metagross reverses flipper controls while blocking heals. Psyduck sneak-in ball saver on Premium/LE has zero grace period. Keep an eye on the alternating outlane ball save and steer with flipper presses.",
    "_src": "https://pinballrulesheets.com/stern/pokemon-rulesheet"
  },
  {
    "name": "Star Wars: Fall of the Empire (Stern Pinball)",
    "code": "v0.98 (Check revision on boot screen or service menu)",
    "skill": "Plunge into flashing shots for 1M (+1M per make). Hit within 3 switches for 2x Super Skill Shot (expires at 6 switches). Each shot awards unique perks: Bumpers (upper playfield) advance Ion Cannons; Left Orbit (far-left) gives +2 JEDI; Luke VUK (mid-left) spots 3 FORCE letters; Droids Target (center-left) spots Hoth lock; Death Star (upper-left) spots DS lock; Center Ramp (center) spots Falcon progress; Sarlacc Pit drop target (mid-right) spots Jabba progress; Right Ramp (center-right) awards 3 TIEs; Right Orbit (far-right) relights skill shots; Stormtrooper Target (right standup) starts hurry-up.",
    "modes": "Rebel Missions, Falcon Features, Jabba Events, and Vader Modes. Rebel Missions: Complete FORCE standup targets (mid-left) to light 8 character modes. Shoot 4 blue shots, finishing at Luke VUK (mid-left). Falcon Features: Shoot Center Ramp (center) when engines are lit (qualify with Right Ramp on Pro or under-ramp target on Prem/LE) to start Lightspeed Escape, That's No Moon, Dogfight, etc. Jabba Events: Knock down Salacious Crumb drop target (mid-right) to shoot Sarlacc Pit (mid-right) and start Luke's Gift, Jabba's Palace, or Rancor Battle. Vader Modes: Qualified via return lanes and started at Vader Scoop (mid-left) when no other modes run.",
    "multi": "Battle of Hoth Multiball: Hit Droids Target (center-left) to qualify 3 virtual locks at Luke VUK (mid-left). Collect jackpots, then Droids Target to spell AT-AT, lighting Super Jackpot at Luke VUK (mid-left). Death Star Multiball: Shoot Death Star Ramp (upper-left) to lock 3 balls. Collect 15 jackpots to light 20M Super Jackpot back at Death Star Ramp. Lightspeed Multiball: 2-ball started during Falcon Lightspeed Escape via Center Ramp (center). Add-A-Ball: Spin Sarlacc Pit (mid-right) 10 times during any multiball to light Action Button add-a-ball. Lightspeed and Hoth Multiballs can be stacked together.",
    "mult": "Ion Cannon Shot Multipliers: Hits to Bumpers (upper playfield) charge Ion Cannons, eventually lighting pulsing Rebel Alliance inserts at major shots. Shoot a pulsing shot to lock in 2x at that lane for the rest of the ball. Lighting all shots upgrades the bonus to a roving 3x multiplier. Force Boost: Playing/completing Rebel Missions permanently boosts associated multiball jackpots by 2x, 3x, or 4x.",
    "strat": "Play Rebel Missions early to earn permanent Force Boost jackpot multipliers across later multiballs. Stack Lightspeed Multiball with Battle of Hoth Multiball while running a high-value Rebel or Falcon mode. Charge Ion Cannons via Bumpers (upper playfield) and lock 2x playfield multipliers onto high-traffic jackpot shots like Center Ramp (center) and Luke VUK (mid-left). During multiballs, repeatedly send stray balls into Sarlacc Pit (mid-right) to secure the 10-spin Add-A-Ball.",
    "watch": "Vader Modes cannot be stacked with multiballs and are untimed\u2014survive to finish at the Vader Scoop (mid-left). Missing the Salacious Crumb drop target (mid-right) can cause direct center drains. Lightspeed Escape has a tight countdown; draining or timing out completely cancels Lightspeed Multiball.",
    "_src": "https://pinballrulesheets.com/stern/star-wars-fall-of-the-empire-rulesheet"
  },
  {
    "name": "Dungeons & Dragons: The Tyrant\u2019s Eye (Stern)",
    "code": "v1.11 - Rath dragon animatronic head center-stage and Faer\u00fbn map inserts between lower flippers",
    "skill": "Short plunge to upper loop (upper-left) or Gelatinous Cube shortcut switch (mid-left). Super Skill: Left eject (lower-left) to side ramp (upper-right) to right ramp (mid-right). MXV Skill: Hidden Temple lane behind upper flipper (upper-left). Values base 2M x ball number; Super and MXV base at 6M.",
    "modes": "Start Town Quests by shooting choose action shot at spinner (center) and traveling via blue shots. Locations feature: Greenest (Attack/Remove Dwarves, Caravan defense/assault, Abandoned Farm), Westgate (Zombie Sailors), Arabel (Retrieve Potion hurry-up), Kobold Town (Rescue Miners, Kobold Vault, Spy On Puck stealth), Dragonspear Castle (Prison Break, Graveyard), and Gauntlgrym (Slaad Assassin, Lifeblood Armor). Finish all quests in a town to start its multi-phase Town Dungeon. Stealth Missions require hitting lit shots while avoiding slings (lower playfield). Dungeon Crawl is lit via dungeon standups (mid-right) or center spinner (center) and started at pop-up scoop (center).",
    "multi": "Dragon Multiball: Complete DRAGON on 3-bank targets under Rath (center) to light right orbit (far-right) and side ramp (upper-right) for 6/8-ball play. Hit Rath (center) repeatedly to damage him before drains deplete; defeating Rath immediately begins Town Celebration Multiball. Gelatinous Cube Multiball: Shoot left orbit (far-left) to lower entrance ramp, then shoot left ramp (mid-left) 1-4 times to trap ball on magnet and collect hurry-up.",
    "mult": "Hidden Temple awards 2x playfield scoring timer (extended by Bard class); Dragon Multiball jackpots scale through 1x, 2x, and 3x levels before qualifying upper loop (upper-left) Super Jackpot; Town Celebration awards 4x Super Jackpot at side loop (upper-right).",
    "strat": "Hold and release the Action Button to unleash roving Ranged Attacks to snipe red battle targets without risking drains; reload at any lane or ramp. Level up your character by fighting battles and exploring Dungeon Crawl levels for legendary equipment. Save healing potions to revive party members between Town Dungeon phases.",
    "watch": "Hitting slingshots drains the Stealth meter during stealth objectives (severely penalizing Barbarians and Clerics); reaching 0% triggers an interrupt battle. In battles, watch red arrows flash faster as monsters prep attacks\u2014if all 4 party members hit 0 HP, the mode instantly fails. Failing to defeat Rath during Dragon Multiball forces a full drain flipper kill.",
    "_src": "https://pinballrulesheets.com/stern/dungeons-dragons-the-tyrants-eye-rulesheet"
  },
  {
    "name": "Metallica Remastered (Stern)",
    "code": "v1.01 - Full-color LCD display with updated animations and band assets",
    "skill": "Standard: Plunge for flashing top rollover (upper-lanes) for 200k (+50k/made); plunge right lane for 2x. Super Skill Shot: Hold left flipper to disable orbit post, then shoot any major shot for 2x value (+100k): Dead End target (mid-right) immediately qualifies 2x Playfield; Scoop (mid-left) lights/collects Mystery; Blue Spider Arrow shot qualifies that lane for Coffin Hurry-Up; Rollovers (upper-lanes) award 2x (4x on right rollover).",
    "modes": "Crank It Up: Collect 12 of each item (Electric Chairs, Grave Markers, Snakes, Coffins) to light Scoop (mid-left). Modes include For Whom the Bell Tolls (light inserts across all shots), Fade to Black (switch hits build jackpot), Battery (repeated shots to Sparky (center) with combo multipliers), and Enter Sandman (hit roving solidly lit inserts). Cash out built jackpot at Scoop (mid-left) after hitting all 4 main features, or risk continuing. Side modes: 72 Seasons (frenzy via 72 switches after pick targets), Hardwired Hurry-Up (light all 5 major shots, scoop (mid-left)), Lady Justice (spell METALLICA via left ramp (mid-left) and right ramp (mid-right), alternate sides), FUEL Fast Scoring (complete FUEL targets (lower-right)), Seek & Destroy (collect 5 Coffin Hurry-Ups; alternate lit seek shot and Captive Ball (mid-left)).",
    "multi": "Electric Chair Multiball: Hit Sparky (center) 10x to start; shoot left orbit (outer-left), right orbit (outer-right), and Sparky (center) to charge Jacob's Ladder for Super Jackpot at Sparky. Grave Marker Multiball: Knock down 3 inline drop targets (center-left) and hit Grave Marker target behind them; hit major shots, then Grave Marker to hold ball on magnet, hit 3 shots to boost multiplier up to 5x, knock ball off magnet for Super Jackpot. Snake Multiball: Complete SNAKE at Snake (mid-right) to start; non-Snake shots build Snake Combo up to 3x, collected at Snake (mid-right). Coffin Multiball: Hit Captive Ball (mid-left) to lock 3 balls; alternate Captive Ball (mid-left) and flashing shots for Jackpots/Super Jackpot (can stack with another multiball!). Add-a-ball / MB 2x: Complete 4 Pick targets (standups) during any MB to light Snake (mid-right) for timed lock, 2x Playfield (20s), and add-a-ball.",
    "mult": "2x Playfield: Complete FUEL targets (lower-right) to light Dead End target (mid-right) for 20s. Snake Multiball Add-A-Ball 2x: Lock ball at Snake (mid-right) during MB for 20s of 2x playfield. Multipliers stack additively for 4x Playfield! Grave Marker Super Jackpot multiplier can be built up to 5x while ball is held on the magnet. Snake Combo multiplier reaches up to 3x at Snake (mid-right).",
    "strat": "Always look to stack Coffin Multiball with either Electric Chair (center) or Grave Marker (center-left) multiballs. During multiballs, immediately focus on completing Pick targets (standups) to lock a ball at Snake (mid-right) for the add-a-ball and 2x playfield, and hit Dead End target (mid-right) to stack FUEL 2x for a combined 4x playfield. Use Super Skill Shot on Dead End target (mid-right) for instant 2x playfield. In Crank It Up, mystery at Scoop (mid-left) awards a free mode advance; cash out when control gets shaky, as draining un-cashed loses the jackpot.",
    "watch": "Direct hits to Sparky (center) rebound dangerously fast straight down the middle. Incomplete shots to the inline drop targets (center-left) or Captive Ball (mid-left) can ricochet unpredictably into outlanes. Snake (mid-right) rejections frequently threaten the right drain. Ball save during Crank It Up modes is extremely brief\u2014do not lose control early.",
    "_src": "https://pinballrulesheets.com/stern/metallica-remastered-rulesheet"
  },
  {
    "name": "The Uncanny X-Men (Stern)",
    "code": "v0.98 - Giant interactive Sentinel head in upper playfield with lower-level Danger Room mini-playfield",
    "skill": "Plunge options: soft plunge into lane near Highway ramp (mid-right) for 200k & +1 Bonus X; hit X-Jet shot (far-left) into X-Mansion ramp for +3 Bonus X, then hit Danger Room exit ramp (lower-left) for Super Skill Shot; shoot Downtown loop (left loop) up to 5 times for combo timer extension (+15s ball save if finished at Uptown left ramp); or shoot Uptown ramp (mid-left) for Cerebro Skill Shot. Follow Cerebro Skill Shot with Highway ramp (mid-right) -> X-Jet (far-left) -> Danger Room ramp (lower-left) for MXV Super Skill Shot (15M and instant Danger Room Level 3).",
    "modes": "Shoot white shots to qualify, then start at Midtown center ramp (center) or Subway right loop (far-right). Complete a mode to trigger The Future (Sentinel defeat or Escape Nimrod) for permanent perks. Level 1 Danger Room doubles mode values. Easy Missions: Rescue the Innocent (Bishop) - 6 red shots, boosted by Bishop pop (upper-left); Bitter Rivalry (Wolverine) - 4 shots, blue scores higher; Smuggled Cargo (Gambit) - 7 blue shots, moving purple awards 2x; Stopping a Juggernaut (Professor X) - alternate red shots and targets. Challenging Missions: Sentinel Facility Raid (Rogue) - 8 moving shots from left to right; A Fiery Assault (Storm) - turn red shots blue, hit 3 blue shots; Mayhem in Midtown (Colossus) - hit standup targets to light flanking yellow/red shots, make 5; Genosha Under Siege (Magneto) - red shots hit Magneto, roving green shots hit Toad for 2x.",
    "multi": "Sentinel Multiball: Hit Sentinel head (upper-center) to spawn, damage integrity until mouth opens, hit inside to start; shoot yellow jackpots (relight/multiply via Danger Room ramp (lower-left)), collect Super Jackpot at Sentinel head (2x in mouth). Save the City: Shoot 6 primary ramps/loops 3x each, start at Midtown ramp (center) or Subway loop (far-right); collect 5 jackpots via playfield feature qualification, then X-Jet ramp (far-left) lights Danger Room spinner (lower-left) for timed 1M-per-spin Super Jackpot. To Me, My X-Men: Spell Cerebro 3x via purple Nightcrawler targets (mid-left/mid-right) and ramps feeding post; shoot blue shots for 6 jackpots, then Uptown ramp (mid-left) for Super Jackpot (or Danger Room ramp (lower-left) for 2x Super). Berserker Multiball: Defeat 35 Sentinels across game; start at Uptown ramp (mid-left); 3-ball play, shoot 5 yellow jackpots then X-Jet ramp (far-left) for Super Jackpot and Danger Room ramp (lower-left) for 2x Super.",
    "mult": "Danger Room Level 1 doubles all mode scoring; Gambit pop bumper (mid-right) awards 2x next shot (3x with Gambit perk, instantly qualified via right inlane Shatz/alley pass); Bishop action button spots highest lit mode shot; Danger Room Level 3 doubles Sentinel values/kills in The Future; Bonus X built via Cerebro Bonus Build targets near left flipper.",
    "strat": "Prioritize Danger Room training during single-ball play to reach Level 1 (green) before starting any mission to guarantee 2x scoring. Complete Smuggled Cargo and Bitter Rivalry early to unlock Gambit (3x shot multiplier) and Wolverine perks. Stack qualified multiballs onto active missions to blow up scoring and safely farm the 35 Sentinel kills needed for Berserker Multiball. Utilize the Fastball Special combo (right inlane to left ramp to Sentinel head) to skip phases of Sentinel Multiball qualification.",
    "watch": "Draining out of the lower Danger Room mini-playfield can be lethal if Abort Ball Save is not active (qualify via 3 X-Jet entries). In competition, extra balls are disabled (Beast Lab level 3 qualifies Beast instead). Bishop action button is completely disabled during Escape Nimrod.",

let games = [], editIdx = null, viewMode = "az", activeLetter = "ALL", activeMfg = "ALL";
const show = id => ["vList","vAddMenu","vDet","vForm","vImp","vExp"].forEach(v => document.getElementById(v).classList.toggle("hidden", v !== id));
const esc = s => String(s || "N/A").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const saveDB = () => localStorage.setItem(DB, JSON.stringify(games));

function getMfg(g) {
  const src = (g._src || "").toLowerCase();
  if (src.includes("/stern/")) return "Stern Pinball";
  if (src.includes("/jersey-jack") || src.includes("/jjp/")) return "Jersey Jack Pinball";
  if (src.includes("/spooky")) return "Spooky Pinball";
  if (src.includes("/american")) return "American Pinball";
  if (src.includes("/chicago-gaming")) return "Chicago Gaming";
  if (src.includes("/barrels-of-fun")) return "Barrels of Fun";
  if (src.includes("/multimorphic")) return "Multimorphic";
  const m = g.name.match(/\(([^)]+)\)/);
  return m ? m.pop() : "Other Manufacturers";
}

function init() {
  const saved = JSON.parse(localStorage.getItem(DB) || "[]");
  const seen = new Set(saved.map(g => (g._src || g.name).toLowerCase()));
  games = [...saved, ...STARTERS.filter(g => !seen.has((g._src || g.name).toLowerCase()))];
  saveDB(); renderList();
}

function setMode(m) {
  viewMode = m; activeLetter = "ALL"; activeMfg = "ALL";
  document.getElementById("tabAZ").className = m === "az" ? "btn" : "btn btn-sec";
  document.getElementById("tabMfg").className = m === "mfg" ? "btn" : "btn btn-sec";
  renderList();
}

function renderList() {
  const q = document.getElementById("qIn").value.toLowerCase();
  const list = document.getElementById("list"), azBar = document.getElementById("azBar");
  list.innerHTML = ""; azBar.innerHTML = "";
  let filtered = games.map((g, i) => ({...g, i})).filter(g => g.name.toLowerCase().includes(q)).sort((a,b) => a.name.localeCompare(b.name));
  document.getElementById("sub").textContent = `${games.length} Machines in Library`;

  if (viewMode === "az") {
    const letters = ["ALL", ...new Set(filtered.map(g => g.name.charAt(0).toUpperCase()).filter(c => /[A-Z0-9]/.test(c)))];
    letters.forEach(L => {
      const b = document.createElement("button"); b.className = "pill" + (activeLetter === L ? " active" : "");
      b.textContent = L; b.onclick = () => { activeLetter = L; renderList(); }; azBar.appendChild(b);
    });
    if (activeLetter !== "ALL") filtered = filtered.filter(g => g.name.toUpperCase().startsWith(activeLetter));
    filtered.forEach(g => list.appendChild(makeCard(g)));
  } else {
    const groups = {};
    filtered.forEach(g => { const m = getMfg(g); (groups[m] = groups[m] || []).push(g); });
    const mfgs = ["ALL", ...Object.keys(groups).sort()];
    mfgs.forEach(M => {
      const b = document.createElement("button"); b.className = "pill" + (activeMfg === M ? " active" : "");
      b.textContent = M === "ALL" ? `All Brands (${filtered.length})` : `${M} (${groups[M].length})`;
      b.onclick = () => { activeMfg = M; renderList(); }; azBar.appendChild(b);
    });
    const showMfgs = activeMfg === "ALL" ? Object.keys(groups).sort() : [activeMfg].filter(m => groups[m]);
    showMfgs.forEach(m => {
      const h = document.createElement("div"); h.className = "grp-hdr"; h.textContent = `${m} (${groups[m].length})`; list.appendChild(h);
      groups[m].forEach(g => list.appendChild(makeCard(g)));
    });
  }
}

function makeCard(g) {
  const d = document.createElement("div"); d.className = "card"; d.onclick = () => showDet(g.i);
  d.innerHTML = `<div><b>${esc(g.name)}</b><div style="font-size:12px;color:var(--muted);">${esc((g.code || "").split("(").shift().trim())}</div></div><b style="color:var(--accent);">›</b>`;
  return d;
}

function showDet(i) {
  show("vDet"); const g = games[i];
  document.getElementById("detBox").innerHTML = `<h2 style="margin:0 0 12px;color:var(--gold);">${esc(g.name)}</h2>` +
    [["Code & Clue","code"],["Skill Shot","skill"],["How to Start Modes","modes"],["Primary Multiball","multi"],["Playfield Multipliers","mult"],["Best Point Strategy","strat"],["Watch Out / Hazards","watch"],["Misc / Personal Notes","misc"]]
    .map(([lbl, k]) => `<div class="fg"><div class="fl">${lbl}</div><div>${esc(g[k])}</div></div>`).join("");
  document.getElementById("editBtn").onclick = () => openForm(i);
  document.getElementById("delBtn").onclick = () => { if(confirm("Delete?")){ games.splice(i,1); saveDB(); show("vList"); renderList(); }};
}

function openForm(i = null) {
  show("vForm"); editIdx = i;
  ["name","code","skill","modes","multi","mult","strat","watch","misc"].forEach(k => document.getElementById("f_"+k).value = i !== null ? (games[i][k] || "") : "");
}

function saveForm() {
  const name = document.getElementById("f_name").value.trim(); if (!name) return alert("Enter Machine Name");
  const obj = {}; ["name","code","skill","modes","multi","mult","strat","watch","misc"].forEach(k => obj[k] = document.getElementById("f_"+k).value.trim() || "N/A");
  if (editIdx !== null) { games[editIdx] = obj; saveDB(); showDet(editIdx); } else { games.push(obj); saveDB(); showDet(games.length - 1); }
}

function copyPdfPrompt() { const b = document.getElementById("pdfPromptBox"); b.select(); navigator.clipboard.writeText(b.value); alert("Prompt copied!"); }
function importJsonCard() {
  const raw = document.getElementById("jsonPasteBox").value.trim(); if (!raw) return alert("Paste the AI summary first!");
  const getLine = tag => { const m = raw.match(new RegExp("(?:^|\\n)[\\s\\*\\-•]*" + tag + "[\\s\\*]*:[\\s\\*]*(.+)", "i")); return m ? m.pop().replace(/^\*+|\*+$/g, "").trim() : ""; };
  const name = getLine("NAME"); if (!name) return alert("Could not find 'NAME:' in pasted text.");
  games.push({ name, code: getLine("CODE")||"Latest Code", skill: getLine("SKILL")||"N/A", modes: getLine("MODES")||"N/A", multi: getLine("MULTI")||"N/A", mult: getLine("MULT")||"N/A", strat: getLine("STRAT")||"N/A", watch: getLine("WATCH")||"N/A", misc: getLine("MISC")||"N/A" });
  saveDB(); document.getElementById("jsonPasteBox").value = ""; showDet(games.length - 1);
}

function openExp() { show("vExp"); document.getElementById("expBox").value = games.map(g => JSON.stringify({ messages: [{ role: "system", content: "Tournament pinball caddy." }, { role: "user", content: "Quick-Look for " + g.name }, { role: "assistant", content: Object.entries(g).map(([k,v]) => k + ": " + v).join("\n") }] })).join("\n"); }
function copyExp() { document.getElementById("expBox").select(); navigator.clipboard.writeText(document.getElementById("expBox").value); alert("Copied!"); }
function dlExp() { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([document.getElementById("expBox").value])); a.download = "pinball.jsonl"; a.click(); }
init();
</script></body></html>

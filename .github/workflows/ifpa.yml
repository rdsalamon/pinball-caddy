name: IFPA Venue Calendar Sync

"on":
  schedule:
    - cron: '15 13,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch IFPA Venue Tournaments
        env:
          IFPA_API_KEY: ${{ secrets.IFPA_API_KEY }}
        run: python ifpa_watcher.py
      - name: Commit tournaments.json if changed
        run: |
          git config user.name "Pinball Caddy Bot"
          git config user.email "bot@://github.com"
          git add tournaments.json
          git diff --staged --quiet || (git commit -m "Bot: Sync IFPA venue calendar" && git push)

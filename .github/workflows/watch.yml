yaml
name: Pinball Code Watcher

on:
  schedule:
    - cron: '0 13,21 * * *' # 8:00 AM & 4:00 PM EST (13:00 & 21:00 UTC)
  workflow_dispatch:         # Allows manual "Run workflow" button anytime

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install beautifulsoup4
      - run: python watcher.py
      - name: Commit updates if changed
        run: |
          git config user.name "Pinball Caddy Bot"
          git config user.email "bot@://github.com"
          git add updates.json
          git diff --staged --quiet || (git commit -m "Bot: Update code & rulesheet feed" && git push)
      - name: Open GitHub Issue Alert
        if: hashFiles('alert.md') != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('alert.md', 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚡ New Pinball Code / Rulesheet Update Detected',
              body
            });
